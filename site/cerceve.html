<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çerçeve içeriği</title>
<link rel="stylesheet" href="css/stil.css">
</head>
<body style="background:#fff;margin:0;padding:18px">
<p style="margin:0 0 12px;font-weight:700">Çerçevenin içindesiniz</p>
<button class="dugme" id="cerceve-dugme" type="button">Çerçevedeki düğme</button>
<p id="cerceve-mesaj" style="margin:12px 0 0;font-weight:700;color:#1f8a4c"></p>
<script>
document.getElementById('cerceve-dugme').addEventListener('click', function () {
  document.getElementById('cerceve-mesaj').textContent = 'Çerçevenin içinden merhaba!';
});
</script>
</body>
</html>
